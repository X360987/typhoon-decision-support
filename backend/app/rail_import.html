<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁路停运工作簿导入</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f6f5;color:#183634;font:16px/1.6 system-ui,sans-serif}
main{max-width:860px;margin:auto;padding:32px 18px} section{background:white;border:1px solid #ced9d5;border-radius:12px;padding:24px;margin:18px 0} h1,h2{line-height:1.3}
label{display:block;margin:12px 0} input,select,button{font:inherit;padding:6px;max-width:100%}button{padding:8px 18px;color:white;background:#16675d;border:0;border-radius:5px;margin-right:8px}button:disabled{background:#657572} table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px}progress{width:100%;accent-color:#16675d}
</style>
<main><h1>铁路停运工作簿导入</h1><section><form id="form">
<label>台风事件　<select id="eventSelect" required></select></label>
<label>写入密钥　<input type="password" id="key" required autocomplete="off"></label>
<label>工作簿　<input id="file" type="file" accept=".xlsx" required></label>
<p>读取 ID_type长表，以日期和原表车次计数。复合车次保留原写法。</p>
<button id="preview">预检工作簿</button><button type="button" id="commit" disabled>确认导入</button></form>
<p role="status" id="status"></p></section><section id="results" hidden><h2>每日停运数量</h2><p id="summary"></p>
<table><thead><tr><th>始发日期</th><th>车次日</th><th>数量分布</th></tr></thead><tbody id="days"></tbody></table></section></main>
<script>
const el = id => document.getElementById(id);
let ticket = null;
async function api(path, options) {
  const response = await fetch('/api/v1/' + path, options);
  const result = await response.json();
  if (!response.ok) throw Error(result.detail?.message || response.statusText);
  return result;
}
async function loadEvents() {
  const datasets = await api('datasets');
  for (const ds of datasets.items) {
    const events = await api('events?' + new URLSearchParams({dataset_id: ds.id}));
    for (const event of events.items) {
      const option = new Option(event.name + ' · ' + ds.name, event.id);
      option.dataset.datasetId = ds.id;
      el('eventSelect').add(option);
      if (event.event_code === '2305') option.selected = true;
    }
  }
  if (!el('eventSelect').length) throw Error('请先创建数据集并关联官方台风事件。');
}
function reset() {
  ticket = null;
  el('commit').disabled = true;
  el('results').hidden = true;
  el('status').textContent = '';
}
async function run(commit) {
  const option = el('eventSelect').selectedOptions[0];
  const context = {dataset_id: option.dataset.datasetId, event_id: option.value};
  const data = new FormData();
  for (const [key,value] of Object.entries(context)) data.set(key,value);
  data.set('file',el('file').files[0]);
  data.set('entity','rail_manual');
  if (commit) { data.set('precheck_token',ticket); data.set('error_policy','strict'); }
  reset();
  const controls = ['file','eventSelect','key','preview'];
  controls.forEach(id => el(id).disabled = true);
  el('status').textContent = commit ? '正在写入数据库…' : '正在预检工作簿…';
  try {
    const result = await api('import/' + (commit ? 'commit' : 'precheck'), {
      method:'POST', body:data, headers:{'X-API-Key':el('key').value,'X-Operator':'rail-demo'}
    });
    if (!commit) {
      el('status').textContent = '长表 ' + result.rows + ' 行，预计新增 ' + result.inserted + ' 条，重复 ' + result.duplicates + ' 条，错误 ' + result.blocking_errors + ' 条。';
      if (result.blocking_errors) el('status').textContent += result.error_rows.slice(0,3).map(r=>'第 '+r.row+' 行：'+r.reasons.join('、')).join('；');
      else {ticket=result.precheck_token; el('commit').disabled=false;}
      return;
    }
    el('status').textContent = result.import_status === 'idempotent_reuse' ? '该工作簿已导入，已复用原批次。' : '已提交，新增 '+result.inserted+' 条。';
    const impact = await api('impact?' + new URLSearchParams(context));
    el('summary').textContent = impact.daily.length+' 天，共 '+impact.total+' 车次日';
    el('days').replaceChildren();
    const peak = Math.max(1,...impact.daily.map(r=>r.count));
    for (const row of impact.daily) {
      const tr=el('days').insertRow();
      tr.insertCell().textContent=row.date;
      tr.insertCell().textContent=row.count;
      const bar=document.createElement('progress');bar.max=peak;bar.value=row.count;
      bar.setAttribute('aria-label',row.date+' 停运数量');tr.insertCell().append(bar);
    }
    el('results').hidden=false;
  } catch(error) {el('status').textContent += ' '+error.message;}
  finally {controls.forEach(id=>el(id).disabled=false);}
}
el('form').onsubmit = event => {event.preventDefault();run(false);};
el('commit').onclick = () => run(true);
el('file').onchange = el('eventSelect').onchange = reset;
loadEvents().catch(error=>el('status').textContent=error.message);
</script></html>
