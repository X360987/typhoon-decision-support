services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: typhoon
      POSTGRES_USER: typhoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typhoon -d typhoon"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://typhoon:${POSTGRES_PASSWORD}@postgres:5432/typhoon
      WRITE_API_KEY: ${WRITE_API_KEY:?Set WRITE_API_KEY in .env}
      STORAGE_DIR: /data/uploads
    volumes:
      - upload_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  upload_data:
